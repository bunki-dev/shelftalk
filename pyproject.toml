[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shelftalk"
version = "0.1.0"
description = "Ask a retail data warehouse questions in plain English: semantic planner + guarded text-to-SQL agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shelftalk = "shelftalk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shelftalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
